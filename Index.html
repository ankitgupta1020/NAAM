    <style>
        :root {
            --saffron:    #f97316;
            --saffron-deep: #c2410c;
            --gold:       #fbbf24;
            --gold-light: #fef3c7;
            --kumkum:     #dc2626;
            --rose:       #fb7185;
            --bg:         #080608;
            --surface:    #100d10;
            --glass:      rgba(251, 191, 36, 0.06);
            --glass-hover:rgba(251, 191, 36, 0.12);
            --border:     rgba(251, 191, 36, 0.18);
            --border-hot: rgba(249, 115, 22, 0.4);
            --text:       #fef9f0;
            --muted:      rgba(254, 249, 240, 0.45);
            --r: 24px;
        }

        *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100dvh;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated gradient background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 70% 50% at 50% -10%, rgba(249,115,22,0.22) 0%, transparent 60%),
                radial-gradient(ellipse 40% 30% at 80% 80%, rgba(220,38,38,0.12) 0%, transparent 50%),
                radial-gradient(ellipse 50% 40% at 10% 60%, rgba(251,191,36,0.07) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
            animation: bgPulse 8s ease-in-out infinite alternate;
        }

        @keyframes bgPulse {
            from { opacity: 0.8; }
            to { opacity: 1.2; }
        }

        /* Noise texture overlay */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
            opacity: 0.6;
        }

        #root { position: relative; z-index: 1; }

        /* Lotus petals floating */
        .petal {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            opacity: 0;
            animation: petalFall linear forwards;
        }
        @keyframes petalFall {
            0%   { opacity: 0; transform: translateY(-20px) rotate(0deg) scale(1); }
            10%  { opacity: 0.7; }
            90%  { opacity: 0.3; }
            100% { opacity: 0; transform: translateY(100vh) rotate(720deg) scale(0.5); }
        }

        /* ─── LAYOUT ─── */
        .app-shell {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            padding: env(safe-area-inset-top, 20px) 18px env(safe-area-inset-bottom, 20px);
            gap: 16px;
        }

        /* ─── HEADER ─── */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 8px;
        }
        .header-brand {
            display: flex; align-items: center; gap: 10px;
        }
        .header-brand .lotus { font-size: 1.5rem; animation: lotusRotate 6s ease-in-out infinite; }
        @keyframes lotusRotate { 0%,100%{transform:rotate(-5deg)} 50%{transform:rotate(5deg)} }
        .brand-name {
            font-family: 'Yatra One', system-ui;
            font-size: 1.1rem;
            color: var(--gold);
            letter-spacing: 0.5px;
        }
        .streak-badge {
            background: linear-gradient(135deg, var(--saffron-deep), var(--kumkum));
            border-radius: 20px;
            padding: 5px 14px;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            display: flex; align-items: center; gap: 5px;
            box-shadow: 0 4px 15px rgba(220,38,38,0.3);
        }

        /* ─── STATS ROW ─── */
        .stats-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }
        .stat-card {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: var(--r);
            padding: 14px 10px;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: border-color 0.3s, background 0.3s;
        }
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--saffron), var(--gold));
            opacity: 0.6;
            border-radius: 2px 2px 0 0;
        }
        .stat-card:hover { background: var(--glass-hover); border-color: var(--border-hot); }
        .stat-label {
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--muted);
        }
        .stat-value {
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--gold);
            line-height: 1.1;
            margin-top: 4px;
            font-variant-numeric: tabular-nums;
        }

        /* ─── MALA PROGRESS ARC ─── */
        .mala-arc-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
            margin-top: -4px;
        }
        .mala-svg-container {
            width: 320px;
            height: 160px;
            position: relative;
        }
        .mala-svg-container svg { width: 100%; height: 100%; }

        /* ─── JAAP ORBS ─── */
        .jaap-orb-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-top: -20px;
        }

        /* Outer glow ring */
        .orb-glow-ring {
            position: absolute;
            width: 310px; height: 310px;
            border-radius: 50%;
            background: conic-gradient(
                from 0deg,
                rgba(249,115,22,0.0) 0%,
                rgba(249,115,22,0.15) 25%,
                rgba(251,191,36,0.2) 50%,
                rgba(220,38,38,0.12) 75%,
                rgba(249,115,22,0.0) 100%
            );
            animation: orbRingSpin 6s linear infinite;
        }
        @keyframes orbRingSpin { to { transform: rotate(360deg); } }

        .orb-glow-ring-2 {
            position: absolute;
            width: 280px; height: 280px;
            border-radius: 50%;
            border: 1.5px solid rgba(251,191,36,0.2);
            animation: orbRingSpin2 4s linear infinite reverse;
        }
        @keyframes orbRingSpin2 { to { transform: rotate(360deg); } }

        .jaap-btn {
            position: relative;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            cursor: pointer;
            border: none;
            outline: none;
            background: none;
            z-index: 5;
            -webkit-user-select: none;
            user-select: none;
        }

        .orb-inner {
            width: 100%; height: 100%;
            border-radius: 50%;
            background:
                radial-gradient(circle at 35% 35%, rgba(254,249,240,0.12) 0%, transparent 45%),
                radial-gradient(circle at 65% 65%, rgba(220,38,38,0.08) 0%, transparent 50%),
                linear-gradient(145deg, rgba(249,115,22,0.15) 0%, rgba(16,13,16,0.9) 60%, rgba(16,13,16,1) 100%);
            border: 1.5px solid rgba(251,191,36,0.25);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            box-shadow:
                0 0 0 1px rgba(249,115,22,0.1),
                0 0 30px rgba(249,115,22,0.15),
                0 0 80px rgba(249,115,22,0.08),
                inset 0 1px 0 rgba(255,255,255,0.08),
                inset 0 -1px 0 rgba(0,0,0,0.3);
            transition: transform 0.08s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.15s ease;
            position: relative;
            overflow: hidden;
        }

        .orb-inner::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: conic-gradient(
                from 0deg,
                transparent 0deg,
                rgba(251,191,36,0.06) 60deg,
                transparent 120deg
            );
            animation: orbShimmer 3s linear infinite;
        }
        @keyframes orbShimmer { to { transform: rotate(360deg); } }

        .jaap-btn:active .orb-inner {
            transform: scale(0.93);
            box-shadow:
                0 0 0 1px rgba(249,115,22,0.3),
                0 0 50px rgba(249,115,22,0.4),
                0 0 100px rgba(249,115,22,0.15),
                inset 0 1px 0 rgba(255,255,255,0.12),
                inset 0 -1px 0 rgba(0,0,0,0.4);
        }

        .orb-radha {
            font-family: 'Tiro Devanagari Hindi', serif;
            font-size: 3.8rem;
            color: var(--saffron);
            text-shadow:
                0 0 20px rgba(249,115,22,0.8),
                0 0 40px rgba(249,115,22,0.4),
                0 0 80px rgba(249,115,22,0.2);
            line-height: 1;
            position: relative;
            z-index: 1;
            animation: radhaGlow 2s ease-in-out infinite alternate;
        }
        @keyframes radhaGlow {
            from { text-shadow: 0 0 20px rgba(249,115,22,0.8), 0 0 40px rgba(249,115,22,0.4); }
            to   { text-shadow: 0 0 30px rgba(251,191,36,0.9), 0 0 60px rgba(249,115,22,0.5), 0 0 100px rgba(249,115,22,0.25); }
        }

        .orb-count {
            font-size: 3.5rem;
            font-weight: 900;
            line-height: 1;
            color: var(--text);
            font-variant-numeric: tabular-nums;
            position: relative;
            z-index: 1;
            letter-spacing: -2px;
        }

        .orb-subtitle {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--muted);
            position: relative;
            z-index: 1;
            margin-top: 2px;
        }

        /* ─── TAP HINT ─── */
        .tap-hint {
            font-size: 0.75rem;
            color: var(--muted);
            letter-spacing: 1px;
            text-align: center;
            animation: hintPulse 2s ease-in-out infinite;
        }
        @keyframes hintPulse { 0%,100%{opacity:0.4} 50%{opacity:0.8} }

        /* ─── PROGRESS SECTION ─── */
        .progress-section {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: var(--r);
            padding: 16px 18px;
            position: relative;
            overflow: hidden;
        }
        .progress-section::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, var(--saffron), var(--gold), var(--saffron), transparent);
            opacity: 0.5;
        }
        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .progress-title {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--muted);
        }
        .progress-pct {
            font-size: 0.85rem;
            font-weight: 900;
            color: var(--gold);
        }
        .progress-bar-track {
            height: 8px;
            background: rgba(255,255,255,0.06);
            border-radius: 99px;
            overflow: hidden;
            position: relative;
        }
        .progress-bar-fill {
            height: 100%;
            border-radius: 99px;
            background: linear-gradient(90deg, var(--saffron-deep), var(--saffron), var(--gold));
            box-shadow: 0 0 12px rgba(249,115,22,0.6);
            transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            position: relative;
        }
        .progress-bar-fill::after {
            content: '';
            position: absolute;
            right: -1px; top: 0; bottom: 0;
            width: 6px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(255,255,255,0.8);
            opacity: 0.8;
        }
        .bead-dots {
            display: flex;
            gap: 3px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        .bead-dot {
            width: 9px; height: 9px;
            border-radius: 50%;
            border: 1px solid rgba(251,191,36,0.2);
            background: rgba(255,255,255,0.04);
            transition: background 0.2s, box-shadow 0.2s, transform 0.2s;
        }
        .bead-dot.filled {
            background: linear-gradient(135deg, var(--saffron), var(--gold));
            border-color: var(--gold);
            box-shadow: 0 0 6px rgba(249,115,22,0.5);
        }
        .bead-dot.current {
            background: var(--gold-light);
            border-color: var(--gold-light);
            box-shadow: 0 0 10px rgba(251,191,36,0.8);
            transform: scale(1.3);
            animation: beadPulse 0.6s ease-in-out;
        }
        @keyframes beadPulse {
            0%   { transform: scale(1); }
            50%  { transform: scale(1.8); box-shadow: 0 0 20px rgba(251,191,36,1); }
            100% { transform: scale(1.3); }
        }

        /* ─── LEADERBOARD ─── */
        .leaderboard-card {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: var(--r);
            padding: 16px 18px;
            position: relative;
            overflow: hidden;
        }
        .leaderboard-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, var(--kumkum), var(--saffron), transparent);
            opacity: 0.5;
        }
        .lb-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .lb-title {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--muted);
        }
        .lb-live {
            display: flex; align-items: center; gap: 5px;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--rose);
            letter-spacing: 0.5px;
        }
        .lb-live-dot {
            width: 6px; height: 6px;
            background: var(--rose);
            border-radius: 50%;
            animation: livePulse 1.5s ease-in-out infinite;
        }
        @keyframes livePulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.6)} }

        .lb-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            transition: background 0.2s;
        }
        .lb-row:last-child { border-bottom: none; }
        .lb-rank {
            width: 28px; height: 28px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.75rem;
            font-weight: 900;
            flex-shrink: 0;
        }
        .lb-rank.r1 { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #1a0a00; }
        .lb-rank.r2 { background: linear-gradient(135deg, #94a3b8, #64748b); color: #fff; }
        .lb-rank.r3 { background: linear-gradient(135deg, #c2410c, #b45309); color: #fff; }
        .lb-rank.rn { background: rgba(255,255,255,0.06); color: var(--muted); }
        .lb-info { flex: 1; min-width: 0; }
        .lb-name { font-weight: 700; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .lb-city { font-size: 0.7rem; color: var(--muted); margin-top: 1px; }
        .lb-count {
            font-size: 1rem;
            font-weight: 900;
            color: var(--gold);
            font-variant-numeric: tabular-nums;
        }

        /* ─── BOTTOM CONTROLS ─── */
        .bottom-controls {
            display: flex;
            gap: 10px;
            padding-bottom: 8px;
        }
        .ctrl-btn {
            flex: 1;
            background: var(--glass);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 13px;
            border-radius: 16px;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.3px;
            transition: background 0.2s, border-color 0.2s, transform 0.1s;

        .ctrl-btn:hover { background: var(--glass-hover); border-color: var(--border-hot); }
        .ctrl-btn:active { transform: scale(0.97); }
        .ctrl-btn.danger:hover { background: rgba(220,38,38,0.1); border-color: rgba(220,38,38,0.4); color: var(--rose); }

        /* ─── SUPPORT FAB ─── */
        .fab-support {
            position: fixed;
            bottom: 22px;
            right: 18px;
            background: linear-gradient(135deg, #fff5e4, #fff);
            color: #7c2d12;
            padding: 11px 20px;
            border-radius: 99px;
            text-decoration: none;
            font-family: 'DM Sans', sans-serif;
            font-weight: 900;
            font-size: 0.82rem;
            letter-spacing: 0.5px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.35), 0 0 0 1px rgba(249,115,22,0.2);

            font-family: 'Tiro Devanagari Hindi', serif;
            font-weight: 700;
            pointer-events: none;
            z-index: 999;
            animation: burstFly 0.9s cubic-bezier(0.22,1,0.36,1) forwards;
            text-shadow: 0 0 20px rgba(249,115,22,0.8);
        }
        @keyframes burstFly {
            0%   { opacity: 1; transform: translateY(0) scale(1); }
            40%  { opacity: 1; transform: translateY(-50px) scale(1.4); }
            100% { opacity: 0; transform: translateY(-120px) scale(0.8); }
        }

        /* ─── MALA COMPLETE OVERLAY ─── */
        .mala-complete {
            position: fixed;
            inset: 0;
            background: rgba(8,6,8,0.92);
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .mala-complete-text {
            font-family: 'Tiro Devanagari Hindi', serif;
            font-size: 5rem;
            color: var(--gold);
            text-shadow: 0 0 40px rgba(251,191,36,0.8);
            animation: celebPulse 0.6s ease-in-out infinite alternate;
        }
        @keyframes celebPulse { from{transform:scale(1)} to{transform:scale(1.08)} }
        .mala-complete-sub {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: 1px;
        }
        .mala-complete-count {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--saffron);
        }

        /* ─── ONBOARDING ─── */
        .onboard-shell {
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            gap: 24px;
            max-width: 400px;
            margin: 0 auto;
        }
        .onboard-hero {
            text-align: center;
        }
        .onboard-hero h1 {
            font-family: 'Tiro Devanagari Hindi', serif;
            font-size: 5rem;
            color: var(--saffron);
            text-shadow: 0 0 40px rgba(249,115,22,0.6);
            animation: radhaGlow 2s ease-in-out infinite alternate;
            margin-bottom: 8px;
        }
        .onboard-hero p {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--muted);
        }
        .onboard-card {
            width: 100%;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 28px 24px;
            position: relative;
            overflow: hidden;
        }
        .onboard-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }
        .onboard-card h2 {
            font-size: 1.1rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 22px;
            color: var(--gold);
        }
        .field-label {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--muted);
            margin-bottom: 6px;
        }
        .field-input {
            width: 100%;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border);
            padding: 14px 16px;
            border-radius: 14px;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            margin-bottom: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .field-input:focus {
            border-color: var(--saffron);
            box-shadow: 0 0 0 3px rgba(249,115,22,0.12);
        }
        .field-input::placeholder { color: rgba(254,249,240,0.25); }
        .btn-enter {
            width: 100%;
            background: linear-gradient(135deg, var(--saffron-deep), var(--saffron), #fb923c);
            border: none;
            color: white;
            padding: 16px;
            border-radius: 16px;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            font-size: 1rem;
            font-weight: 900;
            letter-spacing: 0.5px;
            margin-top: 4px;
            box-shadow: 0 8px 25px rgba(249,115,22,0.35);
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .btn-enter:hover { transform: translateY(-1px); box-shadow: 0 12px 35px rgba(249,115,22,0.45); }
        .btn-enter:active { transform: scale(0.98); }

        /* ─── SEO CONTENT (visually hidden but crawlable) ─── */
        .seo-block {
            padding: 20px 20px 40px;
            max-width: 480px;
            margin: 0 auto;
        }
        .seo-block h2 {
            font-family: 'Yatra One', system-ui;
            font-size: 1.4rem;
            color: var(--gold);
            margin-bottom: 10px;
            margin-top: 28px;
        }
        .seo-block p, .seo-block li {
            font-size: 0.85rem;
            line-height: 1.7;
            color: var(--muted);
        }
        .seo-block ul { padding-left: 16px; }
        .seo-block ul li { margin-bottom: 4px; }
        .seo-divider {
            border: none;
            border-top: 1px solid var(--border);
            margin: 30px 0 10px;
        }
        .faq-item { margin-bottom: 18px; }
        .faq-q { font-size: 0.9rem; font-weight: 700; color: var(--text); margin-bottom: 5px; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(249,115,22,0.3); border-radius: 4px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef } = React;

        /* ── Floating petals ─────────────────────── */
        function spawnPetal(x, y) {
            const el = document.createElement('div');
            el.className = 'petal';
            const emojis = ['🌸','🌺','🪷'];
            el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            const size = 16 + Math.random() * 14;
            el.style.cssText = `font-size:${size}px;left:${x - 12}px;top:${y - 12}px;animation-duration:${2 + Math.random() * 1.5}s`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 3200);
        }

        /* ── Naam burst ──────────────────────────── */
        function spawnBurst(x, y, bead) {
            const el = document.createElement('div');
            el.className = 'naam-burst';
            const msgs = ['राधा'];
            el.innerText = bead % 27 === 0 ? '🪷 राधे' : msgs[bead % msgs.length];
            const col = ['#f97316','#fbbf24','#fb7185','#fef3c7'];
            el.style.cssText = `font-size:${1.2 + Math.random()*0.8}rem;color:${col[bead%4]};left:${x-20}px;top:${y-20}px`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 900);
        }

        /* ── Mala arc SVG ────────────────────────── */
        function MalaArc({ count }) {
            const bead = count % 108;
            const total = 108;
            const segments = [];
            const cx = 160, cy = 155, rx = 130, ry = 120;
            for (let i = 0; i < total; i++) {
                const angle = (i / total) * Math.PI;
                const x = cx + rx * Math.cos(Math.PI - angle);
                const y = cy - ry * Math.sin(angle);
                const filled = i < bead;
                const current = i === bead - 1;
                segments.push({ x, y, filled, current });
            }
            return (
                <div className="mala-arc-wrapper">
                    <div className="mala-svg-container">
                        <svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <radialGradient id="bgGrad" cx="50%" cy="100%">
                                    <stop offset="0%" stopColor="rgba(249,115,22,0.06)"/>
                                    <stop offset="100%" stopColor="rgba(249,115,22,0)"/>
                                </radialGradient>
                                <filter id="glow">
                                    <feGaussianBlur stdDeviation="2" result="blur"/>
                                    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                                </filter>
                            </defs>
                            {segments.map((s, i) => (
                                <circle
                                    key={i}
                                    cx={s.x} cy={s.y}
                                    r={s.current ? 5 : 3.5}
                                    fill={s.current ? '#fef3c7' : s.filled ? '#f97316' : 'rgba(255,255,255,0.08)'}
                                    stroke={s.current ? '#fbbf24' : s.filled ? 'rgba(249,115,22,0.4)' : 'rgba(255,255,255,0.05)'}
                                    strokeWidth="0.5"
                                    filter={s.current ? 'url(#glow)' : undefined}
                                    opacity={s.filled ? 1 : 0.5}
                                />
                            ))}
                        </svg>
                    </div>
                </div>
            );
        }

        /* ── Mala complete overlay ───────────────── */
        function MalaComplete({ malaCount, onDismiss }) {
            useEffect(() => {
                const t = setTimeout(onDismiss, 3000);
                return () => clearTimeout(t);
            }, [onDismiss]);
            return (
                <div className="mala-complete" onClick={onDismiss}>
                    <div className="mala-complete-text">🪷</div>
                    <div className="mala-complete-text" style={{fontSize:'2.5rem'}}>माला पूर्ण!</div>
                    <div className="mala-complete-sub">Mala Round Complete!</div>
                    <div className="mala-complete-count">{malaCount} × 108 = {malaCount * 108}</div>
                    <div style={{fontSize:'0.8rem',color:'rgba(254,249,240,0.4)',marginTop:'8px'}}>Tap to continue</div>
                </div>
            );
        }

        /* ── Main App ────────────────────────────── */
        function App() {
            const [count, setCount]           = useState(0);
            const [user, setUser]             = useState(null);
            const [globalData, setGlobalData] = useState([]);
            const [name, setName]             = useState('');
            const [city, setCity]             = useState('');
            const [showMalaComplete, setMalaComplete] = useState(false);
            const prevMalaRef = useRef(0);

            useEffect(() => {
                const saved = localStorage.getItem('radha_jaap_user');
                if (saved) {
                    const p = JSON.parse(saved);
                    setUser(p);
                    setCount(p.lifetime || 0);
                    prevMalaRef.current = Math.floor((p.lifetime || 0) / 108);
                }
                fetchGlobal();
            }, []);

            const fetchGlobal = async () => {
                try {
                    const res = await fetch('/.netlify/functions/leaderboard');
                    if (res.ok) setGlobalData(await res.json());
                } catch {}
            };

            const handleTap = useCallback((e) => {
                if (!user) return;
                if (navigator.vibrate) navigator.vibrate([8]);

                const x = e?.clientX ?? window.innerWidth / 2;
                const y = e?.clientY ?? window.innerHeight / 2;

                setCount(prev => {
                    const next = prev + 1;
                    const updated = { ...user, lifetime: next };
                    localStorage.setItem('radha_jaap_user', JSON.stringify(updated));

                    const newMala = Math.floor(next / 108);
                    if (newMala > prevMalaRef.current) {
                        prevMalaRef.current = newMala;
                        setTimeout(() => setMalaComplete(true), 100);
                    }

                    spawnBurst(x, y, next);
                    if (next % 10 === 0) { spawnPetal(x, y); spawnPetal(x + 40, y - 30); }

                    fetch('/.netlify/functions/increment', {
                        method: 'POST',
                        body: JSON.stringify({ user_id: user.id, amount: 1 })
                    }).catch(() => {});

                    return next;
                });
            }, [user]);

            useEffect(() => {
                const kd = (e) => {
                    if (e.key === ' ' || e.key === 'Enter') {
                        e.preventDefault();
                        handleTap({ clientX: window.innerWidth / 2, clientY: window.innerHeight / 2 });
                    }
                };
                window.addEventListener('keydown', kd);
                return () => window.removeEventListener('keydown', kd);
            }, [handleTap]);

            const createProfile = async () => {
                if (!name.trim()) return;
                const userData = {
                    id: 'u_' + Math.random().toString(36).slice(2, 11),
                    display_name: name.trim(),
                    city: city.trim() || 'Vrindavan',
                    lifetime: 0
                };
                setUser(userData);
                localStorage.setItem('radha_jaap_user', JSON.stringify(userData));
                fetch('/.netlify/functions/create-profile', {
                    method: 'POST',
                    body: JSON.stringify({ name: userData.display_name, city: userData.city })
                }).catch(() => {});
            };

            const bead = count % 108;
            const malaCount = Math.floor(count / 108);
            const pct = Math.round((bead / 108) * 100);

            /* ── Onboarding ── */
            if (!user) {
                return (
                    <div className="onboard-shell">
                        <div className="onboard-hero">
                            <h1>राधा</h1>
                            <p>Digital Jaap Mala Counter</p>
                        </div>
                        <div className="onboard-card">
                            <h2>🙏 Begin Your Darbar</h2>
                            <div className="field-label">Your Name</div>
                            <input className="field-input" placeholder="Radhe Shyam Das…" value={name} onChange={e => setName(e.target.value)} onKeyDown={e => e.key === 'Enter' && createProfile()} />
                            <div className="field-label">Your City / Dham</div>
                            <input className="field-input" placeholder="Vrindavan, Mathura…" value={city} onChange={e => setCity(e.target.value)} onKeyDown={e => e.key === 'Enter' && createProfile()} />
                            <button className="btn-enter" onClick={createProfile} disabled={!name.trim()}>
                                Enter Darbar ✨
                            </button>
                        </div>
                        <p style={{fontSize:'0.72rem',color:'rgba(254,249,240,0.3)',textAlign:'center',letterSpacing:'0.5px',lineHeight:'1.6'}}>
                            Free forever · No login required · Works offline
                        </p>
                    </div>
                );
            }

            /* ── Main UI ── */
            return (
                <>
                    {showMalaComplete && (
                        <MalaComplete malaCount={malaCount} onDismiss={() => setMalaComplete(false)} />
                    )}

                    <div className="app-shell">
                        {/* Header */}
                        <div className="header">
                            <div className="header-brand">
                                <span className="lotus">🪷</span>
                                <span className="brand-name">NaamJaa</span>
                            </div>
                            <div className="streak-badge">
                                <span>🔥</span>
                                <span>{user.display_name.split(' ')[0]}'s Seva</span>
                            </div>
                        </div>

                        {/* Stats */}
                        <div className="stats-row">
                            <div className="stat-card">
                                <div className="stat-label">Lifetime</div>
                                <div className="stat-value">{count.toLocaleString('en-IN')}</div>
                            </div>
                            <div className="stat-card">
                                <div className="stat-label">Malas</div>
                                <div className="stat-value">{malaCount}</div>
                            </div>
                            <div className="stat-card">
                                <div className="stat-label">This Mala</div>
                                <div className="stat-value">{bead}</div>
                            </div>
                        </div>

                        {/* Mala Arc */}
                        <MalaArc count={count} />

                        {/* Jaap Orb */}
                        <div className="jaap-orb-wrapper">
                            <div className="orb-glow-ring" />
                            <div className="orb-glow-ring-2" />
                            <button className="jaap-btn" onClick={handleTap} aria-label="Tap to count Radha Naam Jaap">
                                <div className="orb-inner">
                                    <div className="orb-radha">राधा</div>
                                    <div className="orb-count">{bead}</div>
                                    <div className="orb-subtitle">of 108 beads</div>
                                </div>
                            </button>
                        </div>

                        <div className="tap-hint">TAP · SPACE · ENTER to count</div>

                        {/* Progress */}
                        <div className="progress-section">
                            <div className="progress-header">
                                <div className="progress-title">Mala Progress</div>
                                <div className="progress-pct">{pct}%</div>
                            </div>
                            <div className="progress-bar-track">
                                <div className="progress-bar-fill" style={{ width: pct + '%' }} />
                            </div>
                            <div className="bead-dots">
                                {Array.from({ length: 108 }, (_, i) => (
                                    <div
                                        key={i}
                                        className={`bead-dot${i < bead ? ' filled' : ''}${i === bead - 1 ? ' current' : ''}`}
                                    />
                                ))}
                            </div>
                        </div>

                        {/* Leaderboard */}
                        <div className="leaderboard-card">
                            <div className="lb-header">
                                <div className="lb-title">Global Seva Board</div>
                                <div className="lb-live"><div className="lb-live-dot" />LIVE</div>
                            </div>
                            {globalData.length > 0 ? globalData.slice(0, 5).map((u, i) => (
                                <div className="lb-row" key={u.id || i}>
                                    <div className={`lb-rank ${i===0?'r1':i===1?'r2':i===2?'r3':'rn'}`}>
                                        {i === 0 ? '👑' : i + 1}
                                    </div>
                                    <div className="lb-info">
                                        <div className="lb-name">{u.display_name}</div>
                                        <div className="lb-city">🏡 {u.city}</div>
                                    </div>
                                    <div className="lb-count">{(u.weekly_total || 0).toLocaleString('en-IN')}</div>
                                </div>
                            )) : (
                                <p style={{textAlign:'center',fontSize:'0.8rem',color:'var(--muted)',padding:'10px 0'}}>
                                    🌐 Syncing global devotees…
                                </p>
                            )}
                        </div>

                        {/* Controls */}
                        <div className="bottom-controls">
                            <button className="ctrl-btn" onClick={() => setCount(prev => {
                                const next = Math.max(0, prev - 1);
                                const updated = { ...user, lifetime: next };
                                localStorage.setItem('radha_jaap_user', JSON.stringify(updated));
                                return next;
                            })}>
                                ← Undo
                            </button>
                            <button className="ctrl-btn danger" onClick={() => {
                                if (confirm('Reset everything and logout?')) {
                                    localStorage.clear();
                                    location.reload();
                                }
                            }}>
                                Reset All
                            </button>
                        </div>
                    </div>

                    {/* SEO Content */}
                    <div className="seo-block">
                        <hr className="seo-divider" />

                        <h2>🪷 What is Radha Naam Jaap?</h2>
                        <p>Radha Naam Jaap is the sacred devotional practice of repeating the divine name <strong>Radha</strong> — the eternal consort of Lord Krishna. In Vaishnavism and especially in the Braj tradition, chanting Radha's name is considered the highest form of bhakti (devotion). Each repetition (jaap) is believed to purify the mind, deepen divine love, and bring one closer to the Divine.</p>

                        <h2>📿 Why 108 Beads in a Mala?</h2>
                        <p>The number <strong>108</strong> is profoundly sacred across Hindu, Buddhist, and Vedic traditions. It represents the 108 Upanishads, the 108 divine names of major deities, and the cosmic distance between Earth, the Sun, and Moon measured in their respective diameters. One full round of 108 beads is called a <em>mala</em>. Many devotees complete multiple malas daily as part of their sadhana (spiritual practice).</p>

                        <h2>🙏 How to Use This Digital Jaap Counter</h2>
                        <ul>
                            <li>Create your free profile — no sign-up or login required.</li>
                            <li>Tap the glowing <strong>राधा</strong> orb for each jaap, or press Space / Enter on desktop.</li>
                            <li>Track your bead-by-bead progress on the 108-bead arc mala.</li>
                            <li>A celebration animation appears on completing each mala round.</li>
                            <li>Your lifetime count is saved to your device automatically.</li>
                            <li>See where you rank among global devotees on the live leaderboard.</li>
                        </ul>

                        <h2>❓ Frequently Asked Questions</h2>
                        <div className="faq-item">
                            <div className="faq-q">Is this digital mala counter free?</div>
                            <p>Yes — NaamJaa is completely free, forever. No subscription, no ads, no account required.</p>
                        </div>
                        <div className="faq-item">
                            <div className="faq-q">Does it work offline?</div>
                            <p>Your count is stored locally on your device, so the counter works even without internet. The global leaderboard requires a connection.</p>
                        </div>
                        <div className="faq-item">
                            <div className="faq-q">Can I use this for other mantras?</div>
                            <p>Absolutely! The 108-bead structure works for any mantra jaap — Hare Krishna, Om Namah Shivaya, Gayatri Mantra, and more. Simply tap for each repetition.</p>
                        </div>
                        <div className="faq-item">
                            <div className="faq-q">What is the significance of Vrindavan / Braj?</div>
                            <p>Vrindavan and the Braj region in Uttar Pradesh, India, are considered the eternal divine abode of Radha and Krishna. Millions of devotees consider even mentally repeating Radha's name while visualising Vrindavan as spiritually transformative.</p>
                        </div>

                        <h2>🌐 About NaamJaa</h2>
                        <p>NaamJaa is a free spiritual tool designed for devotees of all backgrounds who wish to maintain a consistent Naam Jaap practice. Built with love for the global Vaishnavite community — whether you're in Vrindavan, London, New York, or anywhere across the world.</p>

                        <p style={{marginTop:'20px',fontSize:'0.75rem',opacity:0.3,textAlign:'center',letterSpacing:'0.5px'}}>
                            राधे राधे · Radhe Radhe · 🪷 NaamJaa · naamjaa.netlify.app
                        </p>
                    </div>

                    <a href="upi://pay?pa=ankitgupta1181-5@oksbi&pn=Radha%20Jaap&cu=INR" className="fab-support">
                        ❤️ Support Us
                    </a>
                </>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
