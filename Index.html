const { useState, useEffect, useCallback, useRef } = React;

/* ══ Helpers ══ */
function spawnPetal(x, y) {
    const el = document.createElement('div');
    el.className = 'petal';
    el.innerText = ['🌸','🌺','🪷'][Math.floor(Math.random()*3)];
    const s = 14 + Math.random()*14;
    el.style.cssText = `font-size:${s}px;left:${x-12}px;top:${y-12}px;animation-duration:${2+Math.random()*1.5}s`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3600);
}

function spawnBurst(x, y, n) {
    const el = document.createElement('div');
    el.className = 'burst';
    const msgs = ['राधा','॥राधे॥','हरे','जय','🙏','✨','🪷'];
    el.innerText = n % 27 === 0 ? '🪷 राधे' : msgs[n % msgs.length];
    const cols = ['#f97316','#fbbf24','#fb7185','#fef3c7'];
    el.style.cssText = `font-size:${1.1+Math.random()*.8}rem;color:${cols[n%4]};left:${x-20}px;top:${y-20}px`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 950);
}

function initials(name = '') {
    return name.trim().split(' ').map(w=>w[0]||'').join('').slice(0,2).toUpperCase() || '🙏';
}

function fmt(n) {
    if (!n && n!==0) return '0';
    n = Number(n);
    if (n >= 1e7) return (n/1e7).toFixed(1)+' Cr';
    if (n >= 1e5) return (n/1e5).toFixed(1)+' L';
    if (n >= 1000) return (n/1000).toFixed(1)+'K';
    return String(n);
}

/* ══ Firebase writes ══ */
function fbCreate(uid, name, city) {
    db.ref(`users/${uid}`).set({
        displayName: name,
        city: city || 'Vrindavan',
        lifetime: 0,
        weekly: 0,
        joinedAt: Date.now(),
    });
    db.ref('global/totalCount').transaction(n => n || 0);
}

function fbIncrement(uid, amount) {
    // Update user weekly + lifetime
    db.ref(`users/${uid}`).transaction(cur => {
        if (!cur) return null;
        return {
            ...cur,
            lifetime: (cur.lifetime || 0) + amount,
            weekly:   (cur.weekly   || 0) + amount,
        };
    });
    // Global total — ticks live for everyone
    db.ref('global/totalCount').transaction(n => (n || 0) + amount);
    // Live tap event — auto-deleted after 15 seconds
    const ref = db.ref('taps').push({ uid, ts: Date.now(), amount });
    setTimeout(() => ref.remove().catch(()=>{}), 15000);
}

/* ══ Sub-components ══ */
function MalaArc({ count }) {
    const bead = count % 108;
    return (
        <div className="arc">
            <svg viewBox="0 0 320 155" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <filter id="gw">
                        <feGaussianBlur stdDeviation="2" result="b"/>
                        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
                    </filter>
                </defs>
                {Array.from({length:108},(_,i) => {
                    const a = (i/108)*Math.PI;
                    const x = 160 + 130*Math.cos(Math.PI-a);
                    const y = 150 - 118*Math.sin(a);
                    const filled  = i < bead;
                    const current = i === bead-1;
                    return <circle key={i} cx={x} cy={y}
                        r={current ? 5.5 : 3.5}
                        fill={current ? '#fef3c7' : filled ? '#f97316' : 'rgba(255,255,255,0.07)'}
                        stroke={current ? '#fbbf24' : filled ? 'rgba(249,115,22,0.4)' : 'rgba(255,255,255,0.04)'}
                        strokeWidth="0.5"
                        filter={current ? 'url(#gw)' : undefined}
                        opacity={filled||current ? 1 : 0.45}
                    />;
                })}
            </svg>
        </div>
    );
}

function MalaComplete({ malaCount, onDismiss }) {
    useEffect(() => { const t = setTimeout(onDismiss, 3500); return ()=>clearTimeout(t); }, []);
    return (
        <div className="mc" onClick={onDismiss}>
            <div className="mc-e">🪷</div>
            <div className="mc-m">माला पूर्ण!</div>
            <div className="mc-s">Mala Complete — Jai Radhe!</div>
            <div className="mc-c">{malaCount} × 108 = {fmt(malaCount*108)}</div>
            <div style={{fontSize:'.72rem',color:'rgba(254,249,240,.28)',marginTop:'8px'}}>Tap to continue</div>
        </div>
    );
}

/* ══ MAIN APP ══ */
function App() {
    const [count,       setCount]   = useState(0);
    const [user,        setUser]    = useState(null);
    const [leaderboard, setLboard]  = useState([]);
    const [globalTotal, setGlobal]  = useState(0);
    const [actFeed,     setActFeed] = useState([]);
    const [showMalaOk,  setMalaOk]  = useState(false);
    const [name,        setName]    = useState('');
    const [city,        setCity]    = useState('');
    const [connected,   setConn]    = useState(false);

    const prevMala   = useRef(0);
    const userRef    = useRef(null);
    const namesCache = useRef({});

    /* Restore local session */
    useEffect(() => {
        const saved = localStorage.getItem('radha_jaap_user');
        if (saved) {
            const p = JSON.parse(saved);
            setUser(p); userRef.current = p;
            setCount(p.lifetime || 0);
            prevMala.current = Math.floor((p.lifetime||0)/108);
        }
    }, []);

    /* ══ Firebase real-time listeners ══ */
    useEffect(() => {
        // Connection state
        db.ref('.info/connected').on('value', s => setConn(s.val() === true));

        // 1️⃣ GLOBAL COUNTER — updates live for all users
        const gRef = db.ref('global/totalCount');
        gRef.on('value', s => setGlobal(s.val() || 0));

        // 2️⃣ LEADERBOARD — top 10 by weekly count, live
        const lRef = db.ref('users').orderByChild('weekly').limitToLast(10);
        lRef.on('value', snap => {
            const rows = [];
            snap.forEach(c => rows.unshift({ id: c.key, ...c.val() }));
            setLboard(rows);
        });

        // 3️⃣ LIVE TAP FEED — shows who's chanting right now
        const tRef = db.ref('taps').orderByChild('ts').limitToLast(10);
        tRef.on('child_added', async snap => {
            const val = snap.val();
            if (!val) return;
            // Cache user names to avoid repeated reads
            if (!namesCache.current[val.uid]) {
                try {
                    const ns = await db.ref(`users/${val.uid}/displayName`).once('value');
                    const cs = await db.ref(`users/${val.uid}/city`).once('value');
                    namesCache.current[val.uid] = {
                        name: ns.val() || 'Devotee',
                        city: cs.val() || 'Vrindavan'
                    };
                } catch { namesCache.current[val.uid] = { name:'Devotee', city:'Vrindavan' }; }
            }
            const { name: n, city: c } = namesCache.current[val.uid];
            setActFeed(prev => [
                { key: snap.key, name: n, city: c, ts: val.ts },
                ...prev.filter(x => x.key !== snap.key)
            ].slice(0, 5));
        });
        tRef.on('child_removed', snap => {
            setActFeed(prev => prev.filter(x => x.key !== snap.key));
        });

        return () => { gRef.off(); lRef.off(); tRef.off(); };
    }, []);

    /* Tap handler */
    const handleTap = useCallback((e) => {
        const u = userRef.current;
        if (!u) return;
        if (navigator.vibrate) navigator.vibrate([8]);
        const x = e?.clientX ?? window.innerWidth/2;
        const y = e?.clientY ?? window.innerHeight/2;

        setCount(prev => {
            const next = prev + 1;
            const updated = {...u, lifetime: next};
            localStorage.setItem('radha_jaap_user', JSON.stringify(updated));
            userRef.current = updated;
            const nm = Math.floor(next/108);
            if (nm > prevMala.current) {
                prevMala.current = nm;
                setTimeout(() => setMalaOk(true), 80);
            }
            spawnBurst(x, y, next);
            if (next % 9 === 0) { spawnPetal(x, y); spawnPetal(x+30, y-20); }
            fbIncrement(u.id, 1);
            return next;
        });
    }, []);

    /* Keyboard shortcut */
    useEffect(() => {
        const kd = e => {
            if (e.key===' '||e.key==='Enter') {
                e.preventDefault();
                handleTap({ clientX: window.innerWidth/2, clientY: window.innerHeight/2 });
            }
        };
        window.addEventListener('keydown', kd);
        return () => window.removeEventListener('keydown', kd);
    }, [handleTap]);

    /* Create profile */
    const createProfile = () => {
        if (!name.trim()) return;
        const u = {
            id: 'u_' + Math.random().toString(36).slice(2, 11),
            display_name: name.trim(),
            city: city.trim() || 'Vrindavan',
            lifetime: 0,
        };
        setUser(u); userRef.current = u;
        localStorage.setItem('radha_jaap_user', JSON.stringify(u));
        fbCreate(u.id, u.display_name, u.city);
    };

    const bead      = count % 108;
    const malaCount = Math.floor(count / 108);
    const pct       = Math.round((bead / 108) * 100);

    /* ── Onboarding ── */
    if (!user) return (
        <div className="ob">
            <div>
                <h1>राधा</h1>
                <p className="sub">Digital Jaap Mala · Live 🌍</p>
            </div>
            <div className="ocard">
                <h2>🙏 Begin Your Seva</h2>
                <div className="fl">Your Name</div>
                <input className="fi" placeholder="Radhe Shyam Das…" value={name}
                    onChange={e=>setName(e.target.value)}
                    onKeyDown={e=>e.key==='Enter'&&createProfile()} />
                <div className="fl">Your City / Dham</div>
                <input className="fi" placeholder="Vrindavan, Mathura…" value={city}
                    onChange={e=>setCity(e.target.value)}
                    onKeyDown={e=>e.key==='Enter'&&createProfile()} />
                <button className="benter" onClick={createProfile} disabled={!name.trim()}>
                    Enter Darbar ✨
                </button>
            </div>
            <p style={{fontSize:'.68rem',color:'rgba(254,249,240,.26)',textAlign:'center',lineHeight:'1.7'}}>
                Free forever · No login · Live global counter
            </p>
        </div>
    );

    /* ── Main UI ── */
    return (
        <>
            {showMalaOk && <MalaComplete malaCount={malaCount} onDismiss={()=>setMalaOk(false)} />}

            <div className="shell">

                {/* Header */}
                <div className="hdr">
                    <div className="hdr-brand">
                        <span className="lotus">🪷</span>
                        <span className="brand">NaamJaa</span>
                    </div>
                    <div className="online-pill" style={{
                        color: connected ? 'var(--teal)' : '#f59e0b',
                        borderColor: connected ? 'rgba(45,212,191,.25)' : 'rgba(245,158,11,.25)',
                        background: connected ? 'rgba(45,212,191,.1)' : 'rgba(245,158,11,.1)'
                    }}>
                        <div className="odot" style={{background: connected ? 'var(--teal)' : '#f59e0b'}} />
                        {connected ? '🌍 Live' : '📡 Connecting…'}
                    </div>
                </div>

                {/* 🌍 Global Live Counter */}
                <div className="gb">
                    <div>
                        <div className="gb-label">🌍 Total Radha Naam Chanted Worldwide</div>
                        <div className="gb-count">{fmt(globalTotal)}</div>
                        <div className="gb-sub">by all devotees · updates live</div>
                    </div>
                    <div className="gb-icon">🙏</div>
                </div>

                {/* Stats */}
                <div className="stats">
                    <div className="sc">
                        <div className="sl">My Lifetime</div>
                        <div className="sv">{fmt(count)}</div>
                    </div>
                    <div className="sc">
                        <div className="sl">Malas</div>
                        <div className="sv">{malaCount}</div>
                    </div>
                    <div className="sc">
                        <div className="sl">This Mala</div>
                        <div className="sv">{bead}</div>
                    </div>
                </div>

                {/* Mala Arc */}
                <MalaArc count={count} />

                {/* Main Orb */}
                <div className="orb-wrap">
                    <div className="gr1" />
                    <div className="gr2" />
                    <button className="jaap-btn" onClick={handleTap}
                        aria-label="Tap to count Radha Naam Jaap">
                        <div className="orb-in">
                            <div className="or">राधा</div>
                            <div className="oc">{bead}</div>
                            <div className="os">of 108 beads</div>
                        </div>
                    </button>
                </div>

                <div className="hint">TAP · SPACE · ENTER to count</div>

                {/* Progress + 108 Bead Dots */}
                <div className="prog">
                    <div className="ph">
                        <div className="pt">Mala Progress</div>
                        <div className="pp">{pct}%</div>
                    </div>
                    <div className="ptrack">
                        <div className="pfill" style={{width: pct+'%'}} />
                    </div>
                    <div className="beads">
                        {Array.from({length:108},(_,i)=>(
                            <div key={i} className={`bd${i<bead?' f':''}${i===bead-1?' c':''}`} />
                        ))}
                    </div>
                </div>

                {/* ⚡ Live Seva Feed */}
                {actFeed.length > 0 && (
                    <div className="act">
                        <div className="act-hdr">
                            <div className="act-title">⚡ Live Seva Feed</div>
                            <div className="lb-live">
                                <div className="ldot" style={{background:'var(--rose)'}} />
                                Real-time
                            </div>
                        </div>
                        <div className="feed">
                            {actFeed.map((item, i) => (
                                <div className="feed-item" key={item.key || i}>
                                    <div className="ava">{initials(item.name)}</div>
                                    <div className="ai">
                                        <div className="an">{item.name}</div>
                                        <div className="ad">🏡 {item.city}</div>
                                    </div>
                                    <div className="abadge">+1 राधा</div>
                                </div>
                            ))}
                        </div>
                    </div>
                )}

                {/* 🏆 Live Leaderboard */}
                <div className="lb">
                    <div className="lb-hdr">
                        <div className="lb-t">🏆 Weekly Seva Board</div>
                        <div className="lb-live">
                            <div className="ldot" style={{background: connected?'var(--rose)':'#6b7280'}} />
                            {connected ? 'Live' : 'Offline'}
                        </div>
                    </div>
                    {leaderboard.length > 0
                        ? leaderboard.map((u, i) => (
                            <div className="lbr" key={u.id}>
                                <div className={`lrank ${i===0?'r1':i===1?'r2':i===2?'r3':'rn'}`}>
                                    {i===0 ? '👑' : i+1}
                                </div>
                                <div className="li">
                                    <div className="ln">{u.displayName}</div>
                                    <div className="lc-city">🏡 {u.city}</div>
                                </div>
                                <div className="lc">{fmt(u.weekly)}</div>
                            </div>
                        ))
                        : <p style={{textAlign:'center',fontSize:'.78rem',color:'var(--muted)',padding:'10px 0'}}>
                            🌐 {connected ? 'Loading devotees…' : 'Connecting to live data…'}
                          </p>
                    }
                </div>

                {/* Controls */}
                <div className="ctrls">
                    <button className="cbtn" onClick={()=>{
                        setCount(prev => {
                            const next = Math.max(0, prev-1);
                            const u = {...userRef.current, lifetime: next};
                            localStorage.setItem('radha_jaap_user', JSON.stringify(u));
                            userRef.current = u;
                            return next;
                        });
                    }}>← Undo</button>
                    <button className="cbtn d" onClick={()=>{
                        if(confirm('Reset everything and logout?')) {
                            localStorage.clear();
                            location.reload();
                        }
                    }}>Reset All</button>
                </div>
            </div>

            {/* SEO content */}
            <div className="seo">
                <hr className="div" />
                <h2>🪷 What is Radha Naam Jaap?</h2>
                <p>Radha Naam Jaap is the sacred practice of chanting the divine name <strong>Radha</strong>. NaamJaa tracks every jaap with a live global counter — every devotee's count is added together in real time.</p>
                <h2>🌍 Live Global Counter</h2>
                <p>Every tap by every devotee worldwide is reflected instantly. See the global count rise as devotees from Vrindavan to London chant together.</p>
                <h2>📿 Why 108 Beads?</h2>
                <p>108 is sacred in Vedic tradition. One full mala round = 108 beads. NaamJaa animates each bead and celebrates every completion.</p>
                <h2>❓ FAQ</h2>
                <div className="fq"><div className="fq-q">Is this counter free?</div><p>Yes — completely free, forever. No ads, no subscriptions.</p></div>
                <div className="fq"><div className="fq-q">Does it work offline?</div><p>Your personal count saves locally. Global features need internet.</p></div>
                <div className="fq"><div className="fq-q">Can I use it for other mantras?</div><p>Yes — Hare Krishna, Om Namah Shivaya, Gayatri Mantra, or any 108-bead practice.</p></div>
                <p style={{marginTop:'18px',fontSize:'.7rem',opacity:.24,textAlign:'center',letterSpacing:'.5px'}}>राधे राधे · 🪷 NaamJaa · naamjaa.netlify.app</p>
            </div>

            <a href="upi://pay?pa=ankitgupta1181-5@oksbi&pn=Radha%20Jaap&cu=INR" className="fab">❤️ Support</a>
        </>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
